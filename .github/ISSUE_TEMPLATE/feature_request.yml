name: Feature request
description: Suggest an idea or improvement for StintLane.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please [search existing issues](https://github.com/tpg/stintlaneapp/issues?q=is%3Aissue) first. If someone has already asked for it, add a 👍 to their issue instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you're trying to do and what gets in the way.
      placeholder: When I ..., I can't ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe how you'd like StintLane to handle it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you've tried or other ways it could work.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots or examples from other apps. Remove anything private first.
    validations:
      required: false
