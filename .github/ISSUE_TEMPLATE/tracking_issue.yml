name: Application Tracking Issue
description: If you have an app that isn't tracked properly
title: "[Tracking]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please [search existing issues](https://github.com/tpg/stintlaneapp/issues?q=is%3Aissue) first. If someone has already asked for it, add a 👍 to their issue instead.

  - type: textarea
    id: application
    attributes:
      label: Application name
      description: Name of the application that StintLane doesn't track correctly.
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: What type of tracking issue is this?
      description: The StintLane track something or nothing?
      options:
        - Doesn't track at all
        - Tracks incorrectly
    validations:
      required: true


  - type: textarea
    id: description
    attributes:
      label: Describe the tracking issue
      description: Provide a description of what the tracking issue is
    validations:
      required: false
